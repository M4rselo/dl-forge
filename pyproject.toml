[project]
name = "dlfrg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dlfrg"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pytest>=9.1.1",
]
